version: '3.8'

services:
  mongodb:
    image: mongo:latest
    container_name: indabo_mongo
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: indabo_za_mariya
    volumes:
      - mongo_data:/data/db

  backend:
    build: ./backend
    container_name: indabo_backend
    ports:
      - "5000:5000"
    environment:
      MONGODB_URI: mongodb://mongodb:27017/indabo_za_mariya
      JWT_SECRET: your_secret_jwt_key_here
    depends_on:
      - mongodb
    volumes:
      - ./backend:/app

  frontend:
    build: ./frontend
    container_name: indabo_frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend
    volumes:
      - ./frontend:/app

volumes:
  mongo_data:
